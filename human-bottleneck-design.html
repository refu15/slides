<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1600,height=640">
<title>Claude Code時代の「人間ボトルネック」をどう設計で潰すか</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Noto Sans JP', sans-serif;
    background: #f5f5f5;
  }

  #slide {
    width: 1600px;
    height: 640px;
    overflow: hidden;
    background: #fff;
    color: #111;
    display: flex;
    align-items: center;
    position: relative;
  }

  .accent-bar {
    position: absolute;
    top: 0;
    left: 0;
    width: 8px;
    height: 100%;
    background: #2563eb;
  }

  .left {
    flex: 1;
    padding: 0 60px 0 80px;
  }

  .tag {
    display: inline-block;
    font-size: 13px;
    font-weight: 700;
    color: #2563eb;
    letter-spacing: 4px;
    margin-bottom: 24px;
  }

  h1 {
    font-size: 44px;
    font-weight: 900;
    line-height: 1.5;
    letter-spacing: 1px;
    color: #111;
    margin-bottom: 20px;
  }

  h1 .accent {
    color: #2563eb;
  }

  .subtitle {
    font-size: 18px;
    font-weight: 400;
    color: #666;
    line-height: 1.8;
    letter-spacing: 1px;
  }

  .right {
    width: 440px;
    padding: 0 60px 0 0;
  }

  .steps {
    list-style: none;
  }

  .steps li {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 0;
    border-bottom: 1px solid #eee;
    font-size: 16px;
    font-weight: 700;
    color: #333;
  }

  .steps li:last-child {
    border-bottom: none;
  }

  .steps .num {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111;
    color: #fff;
    font-size: 14px;
    font-weight: 900;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .footer {
    position: absolute;
    bottom: 32px;
    right: 48px;
    font-size: 14px;
    color: #bbb;
    letter-spacing: 1px;
  }

  .dl-btn {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 100;
    background: #111;
    color: #fff;
    border: none;
    padding: 10px 20px;
    font-size: 14px;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    border-radius: 4px;
  }
  .dl-btn:hover { background: #333; }

  @media print { .dl-btn { display: none; } }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  <button class="dl-btn" onclick="downloadSlide()">PNG Download</button>

  <div id="slide">
    <div class="accent-bar"></div>

    <div class="left">
      <div class="tag">DESIGN METHODOLOGY</div>

      <h1>
        Claude Code時代の<br>
        <span class="accent">「人間ボトルネック」</span>を<br>
        どう設計で潰すか
      </h1>

      <p class="subtitle">イーロン・マスクの5ステップで<br>チェック・レビュー・指示を再設計する</p>
    </div>

    <div class="right">
      <ul class="steps">
        <li><span class="num">1</span>要件を疑え</li>
        <li><span class="num">2</span>削除する</li>
        <li><span class="num">3</span>最適化する</li>
        <li><span class="num">4</span>加速する</li>
        <li><span class="num">5</span>自動化する</li>
      </ul>
    </div>

    <div class="footer">2026.03</div>
  </div>

  <script>
  function downloadSlide() {
    var btn = document.querySelector('.dl-btn');
    btn.style.display = 'none';
    html2canvas(document.getElementById('slide'), {
      width: 1600, height: 640, scale: 2, useCORS: true
    }).then(function(canvas) {
      var a = document.createElement('a');
      a.download = 'human-bottleneck-design.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
      btn.style.display = '';
    });
  }
  </script>
</body>
</html>
