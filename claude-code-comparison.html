<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1600,height=640">
<title>Claude Code 5つのプラットフォーム完全比較</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Noto Sans JP', sans-serif;
    background: #f5f5f5;
  }

  #slide {
    width: 1600px;
    height: 640px;
    overflow: hidden;
    background: #fff;
    color: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .accent-bar {
    position: absolute;
    top: 0;
    left: 0;
    width: 8px;
    height: 100%;
    background: #e67e22;
  }

  .content {
    text-align: center;
    max-width: 1300px;
    padding: 0 80px;
  }

  .tag {
    display: inline-block;
    font-size: 14px;
    font-weight: 700;
    color: #e67e22;
    letter-spacing: 4px;
    margin-bottom: 28px;
  }

  h1 {
    font-size: 50px;
    font-weight: 900;
    line-height: 1.5;
    letter-spacing: 1px;
    color: #111;
    margin-bottom: 32px;
  }

  h1 .accent {
    color: #e67e22;
  }

  .subtitle {
    font-size: 20px;
    font-weight: 400;
    color: #666;
    letter-spacing: 2px;
    line-height: 1.8;
  }

  .platforms {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-top: 36px;
  }

  .platforms span {
    font-size: 14px;
    font-weight: 700;
    color: #999;
    letter-spacing: 1px;
    padding: 6px 16px;
    border: 1px solid #ddd;
    border-radius: 4px;
  }

  .footer {
    position: absolute;
    bottom: 32px;
    right: 48px;
    font-size: 14px;
    color: #bbb;
    letter-spacing: 1px;
  }

  .dl-btn {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 100;
    background: #111;
    color: #fff;
    border: none;
    padding: 10px 20px;
    font-size: 14px;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    border-radius: 4px;
  }
  .dl-btn:hover { background: #333; }

  @media print { .dl-btn { display: none; } }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  <button class="dl-btn" onclick="downloadSlide()">PNG Download</button>

  <div id="slide">
    <div class="accent-bar"></div>

    <div class="content">
      <div class="tag">COMPARISON SHEET</div>

      <h1>
        Claude Code<span class="accent"> 5つのプラットフォーム</span>を<br>全部触って比較表を作った
      </h1>

      <p class="subtitle">機能比較 / 組織規模別おすすめ / セキュリティ / コスト — 4タブ構成</p>

      <div class="platforms">
        <span>CLI</span>
        <span>Desktop</span>
        <span>Web</span>
        <span>IDE Extension</span>
        <span>GitHub Actions</span>
      </div>
    </div>

    <div class="footer">2026.03</div>
  </div>

  <script>
  function downloadSlide() {
    var btn = document.querySelector('.dl-btn');
    btn.style.display = 'none';
    html2canvas(document.getElementById('slide'), {
      width: 1600, height: 640, scale: 2, useCORS: true
    }).then(function(canvas) {
      var a = document.createElement('a');
      a.download = 'claude-code-comparison.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
      btn.style.display = '';
    });
  }
  </script>
</body>
</html>
