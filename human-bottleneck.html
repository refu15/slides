<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1600,height=640">
<title>Claude Codeが加速させた「人間ボトルネック」という新しい地獄</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1600px;
    height: 640px;
    overflow: hidden;
    font-family: 'Noto Sans JP', sans-serif;
    background: #fff;
    color: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .accent-bar {
    position: absolute;
    top: 0;
    left: 0;
    width: 8px;
    height: 100%;
    background: #d42;
  }

  .content {
    text-align: center;
    max-width: 1300px;
    padding: 0 80px;
  }

  h1 {
    font-size: 52px;
    font-weight: 900;
    line-height: 1.5;
    letter-spacing: 1px;
    color: #111;
    margin-bottom: 36px;
  }

  h1 .accent {
    color: #d42;
  }

  .subtitle {
    font-size: 22px;
    font-weight: 400;
    color: #666;
    letter-spacing: 3px;
  }

  .footer {
    position: absolute;
    bottom: 32px;
    right: 48px;
    font-size: 14px;
    color: #bbb;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="accent-bar"></div>

  <div class="content">
    <h1>
      Claude Codeが加速させた<br>
      <span class="accent">「人間ボトルネック」</span>という新しい地獄
    </h1>
    <p class="subtitle">― 24時間働くのはAIであって、人間ではないはずだった ―</p>
  </div>

  <div class="footer">2026.03</div>
</body>
</html>
