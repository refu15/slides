<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1600,height=640">
<title>Claude Codeが加速させた「人間ボトルネック」という新しい地獄</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Noto Sans JP', sans-serif;
    background: #f5f5f5;
  }

  #slide {
    width: 1600px;
    height: 640px;
    overflow: hidden;
    background: #fff;
    color: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .accent-bar {
    position: absolute;
    top: 0;
    left: 0;
    width: 8px;
    height: 100%;
    background: #d42;
  }

  .content {
    text-align: center;
    max-width: 1300px;
    padding: 0 80px;
  }

  h1 {
    font-size: 52px;
    font-weight: 900;
    line-height: 1.5;
    letter-spacing: 1px;
    color: #111;
    margin-bottom: 36px;
  }

  h1 .accent {
    color: #d42;
  }

  .subtitle {
    font-size: 22px;
    font-weight: 400;
    color: #666;
    letter-spacing: 3px;
  }

  .footer {
    position: absolute;
    bottom: 32px;
    right: 48px;
    font-size: 14px;
    color: #bbb;
    letter-spacing: 1px;
  }

  .dl-btn {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 100;
    background: #111;
    color: #fff;
    border: none;
    padding: 10px 20px;
    font-size: 14px;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    border-radius: 4px;
  }
  .dl-btn:hover { background: #333; }

  @media print { .dl-btn { display: none; } }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  <button class="dl-btn" onclick="downloadSlide()">PNG Download</button>

  <div id="slide">
    <div class="accent-bar"></div>

    <div class="content">
      <h1>
        Claude Codeが加速させた<br>
        <span class="accent">「人間ボトルネック」</span>という新しい地獄
      </h1>
      <p class="subtitle">― 24時間働くのはAIであって、人間ではないはずだった ―</p>
    </div>

    <div class="footer">2026.03</div>
  </div>

  <script>
  function downloadSlide() {
    var btn = document.querySelector('.dl-btn');
    btn.style.display = 'none';
    html2canvas(document.getElementById('slide'), {
      width: 1600, height: 640, scale: 2, useCORS: true
    }).then(function(canvas) {
      var a = document.createElement('a');
      a.download = 'human-bottleneck.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
      btn.style.display = '';
    });
  }
  </script>
</body>
</html>
